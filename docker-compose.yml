name: perkradar
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "38471"
    environment:
      NODE_ENV: production
      PORT: "38471"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      PERKRADAR_ACCESS_TOKEN: ${PERKRADAR_ACCESS_TOKEN:-}
      PERKRADAR_SECURE_COOKIE: "1"
    volumes:
      - perkdata:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 512M
volumes:
  perkdata:
    driver_opts:
      size: 1Gi
